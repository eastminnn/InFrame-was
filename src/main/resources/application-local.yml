# 로컬 개발/평가용 프로필
# 실행: ./gradlew bootRun --args='--spring.profiles.active=local'
# 외부 연동(OAuth, S3, 사업자 검증)은 더미 값이라 로컬에서는 동작하지 않음.
# OpenAI는 실제 키가 필요할 때만 환경변수 OPENAI_API_KEY 로 주입.
server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/inframe?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: inframe
    password: inframe

  jpa:
    show-sql: false

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-local-dummy}

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: local-dummy
            client-secret: local-dummy
          naver:
            client-id: local-dummy
            client-secret: local-dummy

  cloud:
    aws:
      credentials:
        access-key: local-dummy
        secret-key: local-dummy
      s3:
        bucket: local-dummy-bucket

pg:
  datasource:
    url: jdbc:postgresql://localhost:5433/inframe_vector
    username: inframe
    password: inframe

jwt:
  secret:
    # 로컬 전용 더미 키 (Base64, 256bit 이상)
    key: bG9jYWwtZGV2ZWxvcG1lbnQtb25seS1qd3Qtc2VjcmV0LWtleS0xMjM0NTY3ODkw

api:
  public-data:
    service-key: local-dummy

logging:
  level:
    org.hibernate.SQL: info
