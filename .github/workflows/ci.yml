name: CI

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # docker-compose.yml 과 같은 구성 (포트 동일) → application-local.yml 그대로 사용
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: inframe
          MYSQL_USER: inframe
          MYSQL_PASSWORD: inframe
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

      pgvector:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: inframe_vector
          POSTGRES_USER: inframe
          POSTGRES_PASSWORD: inframe
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U inframe -d inframe_vector"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: gradle

      - name: Build and test
        run: bash gradlew build

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
